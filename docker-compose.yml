# ==============================================================================
# Production Docker Compose for CareGuide Backend Stack
# Services: Node.js API + MongoDB 7.0 + Redis 7 (BullMQ Queue)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend REST API Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careguide-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - careguide-net
    stop_grace_period: 30s

  # ----------------------------------------------------------------------------
  # MongoDB Database Service
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: careguide-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: careguide_backend
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - careguide-net

  # ----------------------------------------------------------------------------
  # Redis Service (for BullMQ queues & caching)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: careguide-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - careguide-net

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  mongodb_data:
    name: careguide_mongodb_data
  redis_data:
    name: careguide_redis_data
  uploads_data:
    name: careguide_uploads_data

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  careguide-net:
    name: careguide-network
    driver: bridge
